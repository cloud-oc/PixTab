<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PixTab</title>
  <script src="restore-cache-state.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>

<body data-theme="light">
  <div id="container" class="notReady">
    <div class="maskLayer"></div>
    <div id="wallpaper">
      <div id="backgroundImage"></div>
      <div id="foregroundImage"></div>
    </div>
    <a id="artworkSaveTarget" href="" download aria-label="Save artwork">
      <img id="saveableArtwork" alt="" draggable="false">
    </a>
    <div id="loadingSpinner" aria-hidden="true">
      <div class="pix-spinner" role="img" aria-label="Pix Tab loading">
        <svg class="pix-spinner__frame" viewBox="-150 -120 260 240" xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true">
          <rect class="pix-spinner__stem" x="-92" y="-82" width="50" height="174"></rect>
          <circle class="pix-spinner__loop" cx="0" cy="0" r="92"></circle>
          <circle class="pix-spinner__core" cx="0" cy="0" r="41"></circle>
        </svg>
      </div>
    </div>
    <button id="playPauseButton" class="play-pause-btn hidden" type="button" aria-label="Play/Pause">
      <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M200,32H160a16,16,0,0,0-16,16V208a16,16,0,0,0,16,16h40a16,16,0,0,0,16-16V48A16,16,0,0,0,200,32Zm0,176H160V48h40ZM96,32H56A16,16,0,0,0,40,48V208a16,16,0,0,0,16,16H96a16,16,0,0,0,16-16V48A16,16,0,0,0,96,32Zm0,176H56V48H96Z" transform="scale(0.09375)" />
      </svg>
    </button>

    <div id="settingsOverlay" class="settings-overlay" aria-hidden="true"></div>
    <div id="illustInfo">
      <div id="artworkInfoView" class="info-card-body artwork-info-view">
        <a id="avatar" href="">
          <div id="avatarImage"></div>
        </a>
        <div id="description">
          <div id="illustTitle"><a href="">Untitled</a></div>
          <div id="illustName"><a href=""></a></div>
        </div>
        <div class="info-card-actions">
          <button id="refreshButton" type="button" title="Refresh" aria-label="Refresh artwork">
            <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M224,48V96a8,8,0,0,1-8,8H168a8,8,0,0,1,0-16h28.69L182.06,73.37a79.56,79.56,0,0,0-56.13-23.43h-.45A79.52,79.52,0,0,0,69.59,72.71,8,8,0,0,1,58.41,61.27a96,96,0,0,1,135,.79L208,76.69V48a8,8,0,0,1,16,0ZM186.41,183.29a80,80,0,0,1-112.47-.66L59.31,168H88a8,8,0,0,0,0-16H40a8,8,0,0,0-8,8v48a8,8,0,0,0,16,0V179.31l14.63,14.63A95.43,95.43,0,0,0,130,222.06h.53a95.36,95.36,0,0,0,67.07-27.33,8,8,0,0,0-11.18-11.44Z" transform="scale(0.09375)" />
            </svg>
          </button>
        </div>
      </div>
      <div id="settingsView" class="settings-card-view" aria-hidden="true" inert>
        <iframe id="settingsFrame" src="../options/options.html?embedded=1" title="Settings"></iframe>
      </div>
      <div id="overlayThemeSwitcher" class="overlay-theme-switcher" role="group" aria-label="Theme" aria-hidden="true" inert>
        <button type="button" data-theme-value="light" title="Light Theme" aria-label="Light Theme">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M120,40V16a8,8,0,0,1,16,0V40a8,8,0,0,1-16,0Zm72,88a64,64,0,1,1-64-64A64.07,64.07,0,0,1,192,128Zm-16,0a48,48,0,1,0-48,48A48.05,48.05,0,0,0,176,128ZM58.34,69.66A8,8,0,0,0,69.66,58.34l-16-16A8,8,0,0,0,42.34,53.66Zm0,116.68-16,16a8,8,0,0,0,11.32,11.32l16-16a8,8,0,0,0-11.32-11.32ZM192,72a8,8,0,0,0,5.66-2.34l16-16a8,8,0,0,0-11.32-11.32l-16,16A8,8,0,0,0,192,72Zm5.66,114.34a8,8,0,0,0-11.32,11.32l16,16a8,8,0,0,0,11.32-11.32ZM48,128a8,8,0,0,0-8-8H16a8,8,0,0,0,0,16H40A8,8,0,0,0,48,128Zm80,80a8,8,0,0,0-8,8v24a8,8,0,0,0,16,0V216A8,8,0,0,0,128,208Zm112-88H216a8,8,0,0,0,0,16h24a8,8,0,0,0,0-16Z" transform="scale(0.09375)" />
          </svg>
        </button>
        <button type="button" data-theme-value="dark" title="Dark Theme" aria-label="Dark Theme">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M240,96a8,8,0,0,1-8,8H216v16a8,8,0,0,1-16,0V104H184a8,8,0,0,1,0-16h16V72a8,8,0,0,1,16,0V88h16A8,8,0,0,1,240,96ZM144,56h8v8a8,8,0,0,0,16,0V56h8a8,8,0,0,0,0-16h-8V32a8,8,0,0,0-16,0v8h-8a8,8,0,0,0,0,16Zm72.77,97a8,8,0,0,1,1.43,8A96,96,0,1,1,95.07,37.8a8,8,0,0,1,10.6,9.06A88.07,88.07,0,0,0,209.14,150.33,8,8,0,0,1,216.77,153Zm-19.39,14.88c-1.79.09-3.59.14-5.38.14A104.11,104.11,0,0,1,88,64c0-1.79,0-3.59.14-5.38A80,80,0,1,0,197.38,167.86Z" transform="scale(0.09375)" />
          </svg>
        </button>
        <button type="button" data-theme-value="auto" title="Auto Theme" aria-label="Auto Theme">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm8,16.37a86.4,86.4,0,0,1,16,3V212.67a86.4,86.4,0,0,1-16,3Zm32,9.26a87.81,87.81,0,0,1,16,10.54V195.83a87.81,87.81,0,0,1-16,10.54ZM40,128a88.11,88.11,0,0,1,80-87.63V215.63A88.11,88.11,0,0,1,40,128Zm160,50.54V77.46a87.82,87.82,0,0,1,0,101.08Z" transform="scale(0.09375)" />
          </svg>
        </button>
      </div>
      <button id="settingsButton" title="Settings" aria-label="Open settings" aria-expanded="false" type="button">
        <svg class="icon menu-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M216,128a8,8,0,0,1-8,8H48a8,8,0,0,1,0-16H208A8,8,0,0,1,216,128ZM48,72H208a8,8,0,0,0,0-16H48a8,8,0,0,0,0,16ZM208,184H48a8,8,0,0,0,0,16H208a8,8,0,0,0,0-16Z" transform="scale(0.09375)" />
        </svg>
        <svg class="icon close-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z" transform="scale(0.09375)" />
        </svg>
      </button>
    </div>
  </div>
  <script type="module" src="../entrypoints/newtab.js"></script>
</body>

</html>
